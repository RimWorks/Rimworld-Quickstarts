name: weekly-verify

on:
  schedule:
    - cron: '0 15 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: rimworld 1.6 image
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v4
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: weekly-image-ref
      branches: |
        1.5=version-1.5
        1.6=public
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
    secrets: inherit

  verify:
    name: verify against current RimWorld, then republish
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # stage-game-refs pulls the images the jobs above pushed
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game/1.5

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        id: refs-16
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game/1.6

      - name: Record resolved RimWorld version
        run: |
          version=$(cat "${{ steps.refs-16.outputs.managed-dir }}/Version.txt")
          echo "RIMWORLD_REF=$version" >> "$GITHUB_ENV"
          echo "resolved RimWorld ref: $version"
          # job-wide so the republish stamp sees it. build-versions.sh passes -p: per leg, which wins.
          echo "GameManagedDir=${{ steps.refs-16.outputs.managed-dir }}" >> "$GITHUB_ENV"

      - name: dotnet build
        run: npx build-mod Quickstarts.slnx --nologo

      - name: dotnet test
        run: |
          set -o pipefail
          dotnet test Quickstarts.slnx -c Release --nologo --no-build \
            --logger "console;verbosity=normal" | tee test-output.txt
          passed=$(grep -oE 'Passed:[[:space:]]+[0-9]+' test-output.txt | grep -oE '[0-9]+' | tail -1)
          echo "TESTS_PASSED=${passed:-unknown}" >> "$GITHUB_ENV"

      - uses: RimWorks/mod-ci/.github/actions/steam-republish@v4
        with:
          solution: Quickstarts.slnx
          workshop-id: ${{ vars.WORKSHOP_ID }}
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          verified-rimworld: ${{ env.RIMWORLD_REF }}
          verified-tests: ${{ env.TESTS_PASSED }}
