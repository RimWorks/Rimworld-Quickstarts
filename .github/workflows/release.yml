name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
      packages: write
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: semantic-release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      # stage-game-refs pulls the images ci already built
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install release dependencies
        run: npm ci --ignore-scripts

      # the release builds every version the mod ships, so each one needs its own refs. ci
      # already built both images, so these pulls hit a tag that exists.
      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.5'] }}
          dest: ${{ runner.temp }}/game/1.5

      - uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v4
        id: refs-16
        with:
          image: ${{ fromJSON(needs.ci.outputs.image-refs)['1.6'] }}
          dest: ${{ runner.temp }}/game/1.6

      - name: Get a NuGet API key by trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: aequasi

      - uses: RimWorks/mod-ci/.github/actions/steam-login@v4
        with:
          steam-config-vdf-b64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

      - name: Record the tag before releasing
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          WORKSHOP_ID: ${{ vars.WORKSHOP_ID }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          # the per-version build loop and the stamp both read this
          GAME_REFS_ROOT: ${{ runner.temp }}/game
          # dotnet pack builds Quickstarts too, and it takes the newest version's refs
          GameManagedDir: ${{ steps.refs-16.outputs.managed-dir }}
        run: ./node_modules/.bin/semantic-release

      - uses: RimWorks/mod-ci/.github/actions/discord-release@v4
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          mod-name: Quickstarts
          role-ids: ${{ vars.DISCORD_ROLE_IDS }}
          workshop-id: '3793646067'
          embed-color: 3498DB
          previous-tag: ${{ steps.before.outputs.tag }}
