name: ci

on:
  workflow_call:
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: prose
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v1
    permissions:
      contents: read

  links:
    name: links
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v1
    permissions:
      contents: read
    with:
      args: --config lychee.toml --no-progress README.md README.template.md

  workshop-description:
    name: workshop description
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compile the template to BBCode
        run: |
          npm ci --ignore-scripts
          node --input-type=module -e '
            import { parse, render } from "@steamdown/core";
            import { readFileSync } from "node:fs";
            const [nodes, ctx] = parse(readFileSync("README.template.md", "utf8"));
            const out = render(nodes, ctx);
            if (!out.trim()) {
              throw new Error("README.template.md compiled to nothing");
            }
            console.log(out.slice(0, 400));
          '

  build:
    name: build
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v1
    permissions:
      contents: read
      checks: write
    with:
      solution: Quickstarts.slnx

  game-image:
    name: rimworld 1.6 image
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      branch: version-1.6.4633
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  quickstart:
    name: quickstart (${{ matrix.backend }})
    needs: [game-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        backend: [harmony, concord]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the mod
        run: dotnet build Quickstarts.slnx -c Release

      # pickle-version none: this job runs a quickstart smoke test, not a pickle suite
      - uses: RimWorks/mod-ci/.github/actions/stage-mods@v1
        with:
          backends: ${{ matrix.backend }}
          mods-dir: ${{ runner.temp }}/mods
          config-dir: ${{ runner.temp }}/config
          mod-name: Quickstarts
          mod-package-id: rimworks.quickstarts
          pickle-version: none

      - name: Run the quickstart
        env:
          GAME_IMAGE: ${{ needs.game-image.outputs.image-ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          echo "pulling $GAME_IMAGE ..."
          start=$SECONDS
          docker pull -q "$GAME_IMAGE"
          echo "pulled in $((SECONDS - start))s"

          mkdir -p "$PWD/quickstart-out"
          chmod 777 "$PWD/quickstart-out"

          CFG="/home/app/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"

          status=0
          docker run --rm --name quickstart-run \
            -v "$RUNNER_TEMP/mods:/game/Mods:ro" \
            -v "$RUNNER_TEMP/config:$CFG" \
            -v "$PWD/quickstart-out:/out" \
            "$GAME_IMAGE" \
            run-headless /game/RimWorldLinux -quickstart=ScenarioTestQuickstart \
              -quickstartreport=/out/report.json \
              -quickstartjunit=/out/junit.xml \
              -quickstarttimeout=420 \
              -logfile /out/Player.log || status=$?

          echo "quickstart exited with $status"
          [[ -f quickstart-out/report.json ]] && cat quickstart-out/report.json
          exit "$status"

      - name: Publish the quickstart results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: quickstart (${{ matrix.backend }})
          path: quickstart-out/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-${{ matrix.backend }}
          path: quickstart-out/
          if-no-files-found: warn
