name: ci

on:
  workflow_call:
    secrets:
      STEAM_USERNAME:
        required: false
      STEAM_CONFIG_VDF_B64:
        required: false
      SONAR_TOKEN:
        required: false
    outputs:
      # release builds every version too, and building the images twice costs half an hour
      image-refs:
        description: JSON map of game version to the image the release job compiles against
        value: ${{ jobs.images.outputs.image-refs }}
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: prose
    uses: RimWorks/mod-ci/.github/workflows/prose.yml@v2
    permissions:
      contents: read

  links:
    name: links
    uses: RimWorks/mod-ci/.github/workflows/links.yml@v2
    permissions:
      contents: read
    with:
      args: --config lychee.toml --no-progress README.md README.template.md

  workshop-description:
    name: workshop description
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compile the template to BBCode
        run: |
          npm ci --ignore-scripts
          node --input-type=module -e '
            import { parse, render } from "@steamdown/core";
            import { readFileSync } from "node:fs";
            const [nodes, ctx] = parse(readFileSync("README.template.md", "utf8"));
            const out = render(nodes, ctx);
            if (!out.trim()) {
              throw new Error("README.template.md compiled to nothing");
            }
            console.log(out.slice(0, 400));
          '

  build:
    name: build
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/dotnet-build.yml@v2
    permissions:
      contents: read
      # mod-ci's dotnet-build declares it: the restore pulls packages from ghcr
      packages: read
      checks: write
    with:
      solution: Quickstarts.slnx
      dotnet-version: 10.0.x
      game-images: ${{ needs.images.outputs.image-refs }}

  package-deps:
    name: package deps
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/package-deps.yml@v2
    permissions:
      contents: read
      # stage-game-refs pulls the image the pack compiles against
      packages: read
    with:
      project: Source/Quickstarts.Ref/Quickstarts.Ref.csproj
      reference-packages: |
        Concord.Ref
        Microsoft.NETFramework.ReferenceAssemblies
      game-image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}

  # in ci, not its own workflow: the scan has to compile, and the image it compiles against is
  # the one ci already built. a second image job would race this one on the same tag.
  sonar:
    name: sonar
    needs: images
    uses: RimWorks/mod-ci/.github/workflows/sonar.yml@v2
    permissions:
      contents: read
      packages: read
    with:
      solution: Quickstarts.slnx
      project-key: RimWorks_Rimworld-Quickstarts
      exclusions: Styles/**,artifacts/**,**/bin/**,**/obj/**
      coverage-exclusions: Source/Quickstarts/Builtin/**,Source/Quickstarts/Dev/**,Source/Quickstarts/UI/**,Source/Quickstarts/Patching/PatchBackends.cs,Source/Quickstarts/Patching/QuickstartHooks.cs,Source/Quickstarts/Verification/LogCapture.cs,Source/Quickstarts/Verification/VerificationReport.cs,Source/Quickstarts/AbstractQuickstart.cs,Source/Quickstarts/DelayedActionScheduler.cs,Source/Quickstarts/Logger.cs,Source/Quickstarts/QuickstartArgs.cs,Source/Quickstarts/QuickstartCharacterSetupRegistry.cs,Source/Quickstarts/QuickstartRegistry.cs,Source/Quickstarts/Quickstarter.cs,Source/Quickstarts/QuickstartsMod.cs,Source/Quickstarts/QuickstartsSettings.cs,Source/Quickstarts/VanillaQuicktest.cs,Source/Quickstarts.Patches.*/**
      game-image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # one image name, one tag per branch: the ref comes out as latest-<branch-slug>
  images:
    name: rimworld images
    uses: RimWorks/mod-ci/.github/workflows/game-image.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      artifact-prefix: ci-image-ref
      branches: |
        1.5=version-1.5
        1.6=version-1.6.4633
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game-runnable
    secrets:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF_B64: ${{ secrets.STEAM_CONFIG_VDF_B64 }}

  quickstart:
    name: quickstart (${{ matrix.backend }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        backend: [harmony, concord]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # the game in this job is 1.6, so only 1.6 needs building for it
      - name: Stage game assemblies
        id: refs
        uses: RimWorks/mod-ci/.github/actions/stage-game-refs@v2
        with:
          image: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}

      - name: Build the mod
        run: >
          dotnet build Quickstarts.slnx -c Release -p:GameVersion=1.6
          "-p:GameManagedDir=${{ steps.refs.outputs.managed-dir }}"

      # pickle-version none: this job runs a quickstart smoke test, not a pickle suite
      - uses: RimWorks/mod-ci/.github/actions/stage-mods@v2
        with:
          backends: ${{ matrix.backend }}
          mods-dir: ${{ runner.temp }}/mods
          config-dir: ${{ runner.temp }}/config
          mod-name: Quickstarts
          mod-package-id: rimworks.quickstarts
          pickle-version: none

      - name: Run the quickstart
        env:
          GAME_IMAGE: ${{ fromJSON(needs.images.outputs.image-refs)['1.6'] }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          echo "pulling $GAME_IMAGE ..."
          start=$SECONDS
          docker pull -q "$GAME_IMAGE"
          echo "pulled in $((SECONDS - start))s"

          mkdir -p "$PWD/quickstart-out"
          chmod 777 "$PWD/quickstart-out"

          CFG="/home/app/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios/Config"

          status=0
          docker run --rm --name quickstart-run \
            -v "$RUNNER_TEMP/mods:/game/Mods:ro" \
            -v "$RUNNER_TEMP/config:$CFG" \
            -v "$PWD/quickstart-out:/out" \
            "$GAME_IMAGE" \
            run-headless /game/RimWorldLinux -quickstart=ScenarioTestQuickstart \
              -quickstartreport=/out/report.json \
              -quickstartjunit=/out/junit.xml \
              -quickstarttimeout=420 \
              -logfile /out/Player.log || status=$?

          echo "quickstart exited with $status"
          [[ -f quickstart-out/report.json ]] && cat quickstart-out/report.json
          exit "$status"

      - name: Publish the quickstart results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: quickstart (${{ matrix.backend }})
          path: quickstart-out/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-${{ matrix.backend }}
          path: quickstart-out/
          if-no-files-found: warn
